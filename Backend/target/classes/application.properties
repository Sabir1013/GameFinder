spring.application.name=twitchbackend

# Twitch API Configuration
twitch.clientID=${TWITCH_CLIENT_ID}
twitch.clientSECRET=${TWITCH_CLIENT_SECRET}

# PostgreSQL Configuration
app.populate-database=${APP_POPULATE_DATABASE:false}
spring.datasource.url=${SPRING_DATABASE_URL}
spring.datasource.username=${SPRING_DATABASE_USERNAME}
spring.datasource.password=${SPRING_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Port
server.port=${PORT:8080}